name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Update prices"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Checkout cached prices from data branch
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: data
          path: data-branch

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -f data-branch/prices.json ]; then
            cp data-branch/prices.json _site/prices.json
          else
            echo '{"updatedAt": null, "leagues": {}}' > _site/prices.json
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
