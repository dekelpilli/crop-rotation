name: Update prices

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Fetch prices
        run: python3 scripts/update_prices.py

      - name: Publish to data branch (single squashed commit)
        run: |
          mv prices.json /tmp/prices.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf . --quiet
          mv /tmp/prices.json prices.json
          git add -f prices.json
          git commit -m "Update cached prices"
          git push --force origin data
